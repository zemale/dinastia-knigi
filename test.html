<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест JavaScript</title>
    <style>
        .btn {
            padding: 10px 20px;
            background: #722F37;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        .btn:hover {
            background: #8B3A44;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            background: white;
            margin: 50px auto;
            padding: 20px;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Тест JavaScript</h1>
    <button class="btn" id="testBtn">Тестовая кнопка</button>
    <button class="btn view-collection" data-collection="love">Тест подборки</button>
    
    <div id="test-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h2>Тестовое модальное окно</h2>
            <p>Если это видно, то JavaScript работает!</p>
        </div>
    </div>
    
    <script>
        console.log('JavaScript loaded');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            
            const testBtn = document.getElementById('testBtn');
            const testModal = document.getElementById('test-modal');
            const modalClose = document.querySelector('.modal-close');
            
            testBtn.addEventListener('click', function() {
                console.log('Test button clicked');
                testModal.style.display = 'block';
            });
            
            modalClose.addEventListener('click', function() {
                console.log('Modal close clicked');
                testModal.style.display = 'none';
            });
            
            const viewCollectionButtons = document.querySelectorAll('.view-collection');
            console.log('Found view-collection buttons:', viewCollectionButtons.length);
            
            viewCollectionButtons.forEach(button => {
                button.addEventListener('click', function() {
                    console.log('View collection button clicked');
                    testModal.style.display = 'block';
                });
            });
        });
    </script>
</body>
</html>
