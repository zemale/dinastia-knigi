<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Минимальный тест</title>
    <style>
        .btn {
            padding: 10px 20px;
            background: #722F37;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        .btn:hover {
            background: #8B3A44;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            background: white;
            margin: 50px auto;
            padding: 20px;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Минимальный тест</h1>
    <button class="btn view-collection" data-collection="love">Тест подборки</button>
    <button class="btn read-more" data-article="motivation">Тест статьи</button>
    
    <div id="collection-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h2>Тестовое окно подборок</h2>
            <p>Если это видно, то подборки работают!</p>
        </div>
    </div>
    
    <div id="article-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h2>Тестовое окно статей</h2>
            <p>Если это видно, то статьи работают!</p>
        </div>
    </div>
    
    <script>
        console.log('Minimal test loaded');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            
            // Тест кнопок подборок
            const viewCollectionButtons = document.querySelectorAll('.view-collection');
            console.log('Found view-collection buttons:', viewCollectionButtons.length);
            
            viewCollectionButtons.forEach(button => {
                button.addEventListener('click', function() {
                    console.log('View collection button clicked');
                    document.getElementById('collection-modal').style.display = 'block';
                });
            });
            
            // Тест кнопок статей
            const readMoreButtons = document.querySelectorAll('.read-more');
            console.log('Found read-more buttons:', readMoreButtons.length);
            
            readMoreButtons.forEach(button => {
                button.addEventListener('click', function() {
                    console.log('Read more button clicked');
                    document.getElementById('article-modal').style.display = 'block';
                });
            });
            
            // Тест закрытия модальных окон
            const modalCloseButtons = document.querySelectorAll('.modal-close');
            console.log('Found modal close buttons:', modalCloseButtons.length);
            
            modalCloseButtons.forEach(button => {
                button.addEventListener('click', function() {
                    console.log('Modal close clicked');
                    this.closest('.modal').style.display = 'none';
                });
            });
        });
    </script>
</body>
</html>
